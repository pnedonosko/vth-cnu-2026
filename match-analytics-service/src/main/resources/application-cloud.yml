datasources:
  default:
    url: ${ANALYTICS_JDBC_DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: 5
    minimum-idle: 0
    idle-timeout: 60000
    connection-timeout: 15000
    max-lifetime: 300000

micronaut:
  http:
    client:
      read-timeout: 25s
      connect-timeout: 10s
